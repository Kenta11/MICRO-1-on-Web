[package]
name = "rm1masm_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly wrapper for the rm1masm MICRO-1 microassembler"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
logos = "0.12"
chumsky = "0.8"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
