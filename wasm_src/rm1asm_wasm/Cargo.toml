[package]
name = "rm1asm_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly wrapper for the rm1asm MICRO-1 assembler"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
# binaryen / wasm-opt isn't reliably reachable from this build environment.
wasm-opt = false

[dependencies]
# Versions chosen to match upstream rm1asm 1.0.3.
logos = "0.12"
chumsky = "0.8"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
